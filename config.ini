[settings.execution]
cuda_errchk = false
hotloop_time = false
total_hotloop_time = true
mechanical_energy = false

[settings.physical]
body_count = 45000
steps = 1000
dt = 0.02
softening = 64.0
base_mass = 1e17

[solver]
method = "barnes_hut" # barnes_hut or all_pairs

[solver.barnes_hut]
acceptance_criterion = 0.5
leaf_bucket_size = 64 # optional (default is 32)

[distribution]
method = "plummer"  # random_cube, random_sphere, or plummer

[distribution.random_cube]
size = 15000.0

[distribution.random_sphere]
radius = 15000.0

[distribution.plummer]
max_radius = 15000.0
scale_radius = 2800.0

[exporter]
method = "none" # csv, xdmf, vtp, or none
data_directory = "."
data_file_name = "sim_data"

[exporter.xdmf]
metadata_directory = "."
metadata_out_name = "sim_metadata"